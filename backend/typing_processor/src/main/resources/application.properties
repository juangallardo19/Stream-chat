spring.application.name=typing_processor
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8080

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=typing-processor-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.typing.strategy=${TYPING_STRATEGY:fixed}
app.typing.window-ms=${TYPING_WINDOW_MS:4000}
app.typing.sweep-ms=1000

management.endpoints.web.exposure.include=health

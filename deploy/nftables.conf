#!/usr/sbin/nft -f

table inet firewall
flush table inet firewall

table inet firewall {

    set admin_ips {
        type ipv4_addr
        flags interval
        elements = { 203.0.113.10/32, 203.0.113.11/32, 203.0.113.12/32 }
    }

    set ssh_scanners {
        type ipv4_addr
        flags dynamic, timeout
        timeout 15m
    }

    set dns_publicos_bloqueados {
        type ipv4_addr
        elements = { 8.8.8.8, 8.8.4.4, 1.1.1.1, 1.0.0.1 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        meta l4proto ipv6-icmp accept

        tcp dport 22 ct state new add @ssh_scanners { ip saddr limit rate over 4/minute } log prefix "[NFT_SSH_SCAN] " drop
        tcp dport 22 ip saddr @admin_ips accept

        tcp dport 80 accept

        limit rate 5/minute log prefix "[NFT_INPUT_DROP] "
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iifname { "docker0", "br-*" } accept

        oifname { "docker0", "br-*" } tcp dport 80 ct status dnat accept

        limit rate 5/minute log prefix "[NFT_FORWARD_DROP] "
    }

    chain output {
        type filter hook output priority filter; policy accept;

        udp dport 53 ip daddr @dns_publicos_bloqueados log prefix "[NFT_ROGUE_DNS] " reject
        tcp dport 53 ip daddr @dns_publicos_bloqueados log prefix "[NFT_ROGUE_DNS] " reject
    }
}
